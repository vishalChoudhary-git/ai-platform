line-length = 100
target-version = "py312"

[lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

ignore = []

[lint.per-file-ignores]
"migrations/**/*.py" = ["E501"]
"app/plugins/expenses/agent/agent.py" = ["E501"]
"app/plugins/expenses/resolution/service.py" = ["E501"]
"app/plugins/expenses/notifications/service.py" = ["E501"]